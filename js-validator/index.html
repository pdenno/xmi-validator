<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XMI Validator</title>
    <link rel="stylesheet" href="/src/ui/styles.css">
  </head>
  <body class="theme-light">
    <div id="app">
      <header>
        <h1>XMI Validator</h1>
         <select id="theme-selector">
           <option value="theme-light">Light</option>
           <option value="theme-dark">Dark</option>
           <option value="theme-hello-kitty">Hello Kitty</option>
         </select>
          <button id="settings-toggle" style="background: none; border: 1px solid #888; color: #888; cursor: pointer; border-radius: 4px; padding: 4px 8px;">Settings</button>
      </header>
      <div id="settings-panel" style="display: none; background: rgba(0,0,0,0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <h3>Advanced Configuration</h3>
        <p style="font-size: 0.9em; margin-bottom: 10px;">Enter URI Mapping JSON (e.g. <code>{"http://old/url.xmi": "https://new/url.xmi"}</code>):</p>
        <textarea id="uri-mapping" style="width: 100%; height: 80px; font-family: monospace;" placeholder='{"http://www.omg.org/spec/UML/20131001/UML.xmi": "..."}'></textarea>
      </div>
      <main>
        <div class="actions" style="margin-bottom: 20px; display: flex; gap: 10px; align-items: center;">
          <button id="load-button" style="padding: 12px 24px; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold;">Load XMI File(s)</button>
          <input type="file" id="file-input" multiple style="display: none;">
          <span style="opacity: 0.7;">or drag and drop below</span>
        </div>
        <div id="drop-zone">Drop XMI Files Here</div>
        <div id="results"></div>
      </main>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
